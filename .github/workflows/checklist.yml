name: Checklist

on:
  pull_request:
    paths-ignore:
      - 'values.schema.json'
      - '.github/workflows/lint-values.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  checklist:
    name: Checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Check ## Unreleased has a bullet"
        id: check
        run: |
          if python3 .github/scripts/changelog_tool.py check-unreleased CHANGELOG.md; then
            echo "unreleased_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: checklist
          message: |
            - [${{ steps.check.outputs.unreleased_ok == 'true' && 'x' || ' ' }}] Added a bullet under `## Unreleased` in `CHANGELOG.md`
            - Once you have the right number of approvals, comment `/merge` to merge this PR into the target branch
